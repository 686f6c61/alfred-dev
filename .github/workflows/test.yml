# Pipeline de tests automaticos para Alfred Dev.
#
# Se ejecuta en cada push y pull request sobre main. Cubre Python 3.10-3.13
# en Ubuntu (entorno mas cercano a produccion). No necesita dependencias
# externas porque el proyecto usa exclusivamente la stdlib de Python.
#
# Seguridad: no se usa ningun input dinamico de usuario (issue titles,
# PR bodies, commit messages) en bloques run:. Todos los comandos son
# literales estaticos.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Ejecutar tests
        run: python3 -m pytest tests/ -v --tb=short

      - name: Ejecutar tests con cobertura (solo 3.12)
        if: matrix.python-version == '3.12'
        run: |
          python3 -m pip install --quiet coverage
          coverage run -m pytest tests/ -v --tb=short
          coverage report --fail-under=60
          coverage html -d coverage-html

      - name: Subir informe de cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/
          retention-days: 14
