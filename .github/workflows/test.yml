# Pipeline de tests automaticos para Alfred Dev.
#
# Se ejecuta en cada push y pull request sobre main y Alfred-Astro. Cubre
# Python 3.10-3.13 en Ubuntu (entorno mas cercano a produccion). No necesita
# dependencias externas porque el proyecto usa exclusivamente la stdlib de
# Python y, en Alfred-Astro, valida tambien la landing Astro.
#
# Seguridad: no se usa ningun input dinamico de usuario (issue titles,
# PR bodies, commit messages) en bloques run:. Todos los comandos son
# literales estaticos.

name: Tests

on:
  push:
    branches: [main, Alfred-Astro]
  pull_request:
    branches: [main, Alfred-Astro]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias de test
        run: python3 -m pip install --quiet pytest

      - name: Ejecutar tests
        run: python3 -m pytest tests/ -v --tb=short

      - name: Ejecutar tests con cobertura (solo 3.12)
        if: matrix.python-version == '3.12'
        run: |
          python3 -m pip install --quiet coverage
          coverage run -m pytest tests/ -v --tb=short
          coverage report --fail-under=60
          coverage html -d coverage-html

      - name: Subir informe de cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/
          retention-days: 14

  site:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependencias del sitio
        run: npm ci

      - name: Validar tipos y contenido del sitio
        run: npm run check

      - name: Compilar sitio estático
        run: npm run build
