# Pipeline de tests automaticos para la web Astro de Alfred Dev.
#
# Se ejecuta en cada push y pull request sobre Alfred-Astro. main es la rama
# del plugin y mantiene su propio workflow Python; esta rama valida solo la
# landing Astro.
#
# Seguridad: no se usa ningun input dinamico de usuario (issue titles,
# PR bodies, commit messages) en bloques run:. Todos los comandos son
# literales estaticos.

name: Web

on:
  push:
    branches: [Alfred-Astro]
  pull_request:
    branches: [Alfred-Astro]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependencias del sitio
        run: npm ci

      - name: Validar tipos y contenido del sitio
        run: npm run check

      - name: Compilar sitio estático
        run: npm run build
