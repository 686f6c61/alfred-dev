<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selina — La Estilista</title>
  <style>
    /* =====================================================================
       Variables de tema — direccion editorial cálida, sin sesgo morado
       ===================================================================== */
    :root {
      color-scheme: light;
      --accent: #b85c38;
      --accent-strong: #7f3f28;
      --accent-soft: rgba(184, 92, 56, 0.14);
      --accent-hover: rgba(184, 92, 56, 0.2);
      --bg: #f7f3ee;
      --bg-elevated: #fcfaf7;
      --bg-card: rgba(255, 255, 255, 0.94);
      --bg-header: rgba(255, 255, 255, 0.9);
      --text: #201714;
      --text-secondary: #5f4c42;
      --text-muted: #91796c;
      --border: rgba(118, 87, 71, 0.12);
      --border-selected: var(--accent);
      --shadow: 0 16px 34px rgba(67, 44, 31, 0.08);
      --shadow-hover: 0 22px 46px rgba(67, 44, 31, 0.14);
      --radius: 24px;
      --radius-sm: 14px;
      --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --font-sans: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --grid-line: rgba(118, 87, 71, 0.08);
    }

    /* =====================================================================
       Reset y base
       ===================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background:
        radial-gradient(circle at top right, rgba(184, 92, 56, 0.07), transparent 18rem),
        linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg) 100%);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      inset: auto;
      border-radius: 999px;
      filter: blur(28px);
      opacity: 0.3;
      z-index: 0;
    }

    body::before {
      width: 18rem;
      height: 18rem;
      top: -4rem;
      right: -4rem;
      background: radial-gradient(circle, rgba(184, 92, 56, 0.18), transparent 68%);
    }

    body::after {
      width: 20rem;
      height: 20rem;
      bottom: -6rem;
      left: -6rem;
      background: radial-gradient(circle, rgba(127, 63, 40, 0.12), transparent 72%);
    }

    /* =====================================================================
       Cabecera
       ===================================================================== */
    .alfred-header {
      background: var(--bg-header);
      border: 1px solid var(--border);
      padding: 0.9rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: static;
      z-index: 100;
      width: min(1240px, calc(100% - 2rem));
      margin: 0.9rem auto 0;
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .alfred-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .alfred-title {
      font-family: var(--font-display);
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--accent-strong);
    }

    .alfred-phase {
      font-size: 0.76rem;
      color: var(--text-secondary);
      padding: 0.22rem 0.72rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0.12));
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .alfred-connection {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .alfred-connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #27ae60;
      transition: background 0.3s;
    }

    /* =====================================================================
       Contenido principal
       ===================================================================== */
    .alfred-body {
      flex: 1;
      padding: 2rem 1.5rem 2rem;
      max-width: 1240px;
      margin: 0 auto;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* =====================================================================
       Barra indicadora inferior
       ===================================================================== */
    .alfred-indicator {
      background: var(--bg-header);
      border: 1px solid var(--border);
      padding: 0.75rem 1.2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-secondary);
      position: static;
      width: min(920px, calc(100% - 2rem));
      margin: 1.2rem auto 1.4rem;
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      z-index: 2;
    }

    /* =====================================================================
       Mensaje de espera
       ===================================================================== */
    .waiting-message {
      text-align: center;
      color: var(--text-secondary);
      font-size: 1.08rem;
      padding: 4.5rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,0.42), rgba(255,255,255,0.18));
      box-shadow: var(--shadow);
    }

    .style-screen-header {
      margin-bottom: 1.75rem;
      max-width: 780px;
    }

    .style-screen-header h1 {
      font-family: var(--font-display);
      font-size: clamp(2.1rem, 4vw, 3.35rem);
      line-height: 0.96;
      margin-bottom: 0.65rem;
      color: var(--text);
      letter-spacing: -0.03em;
    }

    .style-screen-kicker {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .style-screen-subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 56ch;
    }

    /* =====================================================================
       Rejilla de opciones — layout de tres columnas
       ===================================================================== */
    .style-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      .style-grid {
        grid-template-columns: 1fr;
      }
    }

    /* =====================================================================
       Opcion de estilo — columna seleccionable
       ===================================================================== */
    .style-option {
      --option-accent: var(--accent);
      --option-accent-soft: var(--accent-soft);
      --option-accent-glow: rgba(184, 92, 56, 0.24);
      --option-accent-alt: var(--accent-strong);
      --option-accent-alt-soft: rgba(127, 63, 40, 0.16);
      --option-surface: rgba(255, 250, 245, 0.84);
      --option-surface-alt: rgba(184, 92, 56, 0.12);
      --option-surface-soft: rgba(255, 250, 245, 0.88);
      --option-surface-alt-soft: rgba(184, 92, 56, 0.16);
      --option-ink: var(--text);
      --option-muted: var(--text-secondary);
      --option-border: rgba(118, 87, 71, 0.12);
      --option-border-strong: rgba(118, 87, 71, 0.22);
      --option-grid: rgba(118, 87, 71, 0.08);
      --option-heading-font: var(--font-display);
      --option-body-font: var(--font-sans);
      background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(250,247,243,0.94));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.22s, box-shadow 0.22s, transform 0.18s, background 0.22s;
      position: relative;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      color: var(--option-ink);
      font-family: var(--option-body-font);
    }

    .style-option:hover {
      border-color: var(--option-accent);
      box-shadow: var(--shadow-hover);
      transform: translateY(-4px);
      background: linear-gradient(180deg, rgba(255,255,255,0.99), rgba(248,244,239,0.96));
    }

    .style-option.selected {
      border-color: var(--option-accent);
      box-shadow:
        0 0 0 4px var(--option-accent-soft),
        0 0 0 1px rgba(255,255,255,0.86) inset,
        var(--shadow-hover);
      transform: translateY(-6px);
      background: linear-gradient(180deg, rgba(255,255,255,0.99), rgba(246,242,237,0.97));
    }

    .style-option--family-card {
      display: block;
    }

    /* =====================================================================
       Insignia de letra (A, B, C)
       ===================================================================== */
    .style-letter {
      position: absolute;
      top: 0.9rem;
      left: 0.9rem;
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--option-accent), var(--accent-strong));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.86rem;
      z-index: 2;
      box-shadow: 0 10px 24px var(--option-accent-glow);
    }

    /* =====================================================================
       Zona de previsualizacion
       ===================================================================== */
    .style-preview {
      min-height: 300px;
      padding: 2.45rem 1.35rem 1.35rem;
      background: linear-gradient(180deg, var(--option-surface), var(--option-surface-alt));
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .style-preview::after {
      content: "";
      position: absolute;
      width: 12rem;
      height: 12rem;
      right: -3rem;
      bottom: -3.5rem;
      border-radius: 50%;
      background: radial-gradient(circle, var(--option-accent-glow), transparent 72%);
      z-index: -1;
    }

    .preview-tone-note {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--option-muted);
      background: var(--option-surface-soft);
      border: 1px solid var(--option-border);
      padding: 0.22rem 0.5rem;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      max-width: calc(100% - 4.2rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =====================================================================
       Zona de metadatos (debajo de la previsualizacion)
       ===================================================================== */
    .style-meta {
      padding: 1.1rem 1.25rem 1.25rem;
      border-top: 1px solid var(--border);
    }

    .style-badges,
    .style-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .style-badges {
      margin-bottom: 0.75rem;
    }

    .style-links {
      margin-top: 0.75rem;
    }

    .style-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.28rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--option-border);
      background: var(--option-surface-alt-soft);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--option-ink);
      backdrop-filter: blur(8px);
    }

    .style-badge--soft {
      color: var(--option-muted);
      border-color: var(--option-border);
    }

    .style-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--option-border);
      background: var(--option-surface-soft);
      color: var(--option-ink);
      text-decoration: none;
      font-size: 0.74rem;
      font-weight: 600;
      line-height: 1;
      font-family: var(--option-body-font);
    }

    .style-link:hover {
      border-color: var(--option-accent);
      color: var(--option-accent);
    }

    .style-name {
      font-family: var(--option-heading-font);
      font-size: 1.28rem;
      font-weight: 700;
      line-height: 1.05;
      margin-bottom: 0.45rem;
      color: var(--option-ink);
    }

    .style-description {
      font-size: 0.87rem;
      color: var(--option-muted);
      line-height: 1.5;
      margin-bottom: 0.85rem;
      font-family: var(--option-body-font);
    }

    /* =====================================================================
       Paleta de colores
       ===================================================================== */
    .palette {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }

    .palette-dot {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.35);
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(32, 23, 20, 0.06);
    }

    .hex {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: "SF Mono", "IBM Plex Mono", "Fira Code", monospace;
    }

    /* =====================================================================
       Etiquetas de tipografia y tono
       ===================================================================== */
    .style-typo,
    .style-tone,
    .style-sample {
      font-size: 0.79rem;
      color: var(--text-muted);
      margin-bottom: 0.32rem;
      font-family: var(--option-body-font);
    }

    .style-typo strong,
    .style-tone strong,
    .style-sample strong {
      color: var(--option-ink);
    }

    /* =====================================================================
       Elementos mock para previsualizacion
       ===================================================================== */
    .mock-nav {
      height: 34px;
      border-radius: var(--radius-sm);
      background: var(--option-surface-soft);
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      padding: 0 0.75rem;
      gap: 0.5rem;
      border: 1px solid var(--option-border);
      backdrop-filter: blur(8px);
    }

    .mock-nav span {
      display: block;
      width: 32px;
      height: 6px;
      border-radius: 3px;
      background: var(--option-surface-alt-soft);
    }

    .mock-hero {
      border-radius: var(--radius-sm);
      background: linear-gradient(180deg, var(--option-surface-soft), var(--option-surface-alt-soft));
      padding: 1.55rem 1rem;
      margin-bottom: 0.85rem;
      text-align: left;
      border: 1px solid var(--option-border);
      backdrop-filter: blur(8px);
    }

    .mock-hero h4 {
      font-family: var(--option-heading-font);
      font-size: 1.18rem;
      line-height: 1.05;
      color: var(--option-ink);
      margin-bottom: 0.4rem;
      max-width: 14ch;
    }

    .mock-hero p {
      font-size: 0.76rem;
      color: var(--option-muted);
      max-width: 24ch;
      font-family: var(--option-body-font);
    }

    .mock-button {
      display: inline-block;
      padding: 0.48rem 0.95rem;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--option-accent), var(--option-accent-alt));
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-align: center;
      margin-top: 0.8rem;
      box-shadow: 0 10px 20px var(--option-accent-glow);
      font-family: var(--option-body-font);
    }

    .mock-card {
      border-radius: var(--radius-sm);
      background: var(--option-surface-soft);
      padding: 0.9rem;
      margin-bottom: 0.5rem;
      border: 1px solid var(--option-border);
      backdrop-filter: blur(8px);
    }

    .preview-technical {
      display: grid;
      gap: 0.8rem;
      color: #eef4ff;
    }

    .preview-technical-header {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .preview-status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0 0.7rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(15, 23, 42, 0.42);
    }

    .preview-status-pill--ok {
      color: #d1fae5;
      border-color: rgba(16, 185, 129, 0.32);
      background: rgba(16, 185, 129, 0.18);
    }

    .preview-status-pill--warn {
      color: #fde68a;
      border-color: rgba(245, 158, 11, 0.28);
      background: rgba(245, 158, 11, 0.18);
    }

    .preview-technical-chart {
      height: 108px;
      border-radius: var(--radius-sm);
      background:
        linear-gradient(180deg, var(--option-surface-alt-soft), rgba(15, 23, 42, 0.02)),
        linear-gradient(120deg, var(--option-accent-soft), transparent 35%),
        linear-gradient(180deg, var(--option-surface-soft), rgba(255,255,255,0.02));
      border: 1px solid var(--option-border);
      position: relative;
      overflow: hidden;
    }

    .preview-technical-chart::after {
      content: "";
      position: absolute;
      inset: auto 10% 22% 10%;
      height: 2px;
      background: linear-gradient(90deg, rgba(16,185,129,0), var(--option-accent), var(--option-accent-alt), rgba(239,68,68,0));
      box-shadow: 0 0 18px var(--option-accent-glow);
    }

    .preview-technical-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.55rem;
    }

    .preview-technical-panel {
      min-height: 56px;
      border-radius: var(--radius-sm);
      background: var(--option-surface-soft);
      border: 1px solid var(--option-border);
    }

    .preview-technical-panel--accent {
      background: linear-gradient(180deg, var(--option-accent-soft), var(--option-surface-soft));
      border-color: var(--option-border-strong);
    }

    .preview-technical-lines {
      display: grid;
      gap: 0.42rem;
    }

    .preview-technical-lines span {
      display: block;
      height: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,0.22);
    }

    .preview-technical-lines span:nth-child(2) {
      width: 82%;
    }

    .preview-technical-lines span:nth-child(3) {
      width: 66%;
    }

    .mock-card h5 {
      font-size: 0.82rem;
      color: var(--option-ink);
      margin-bottom: 0.32rem;
      font-family: var(--option-heading-font);
    }

    .mock-card p {
      font-size: 0.72rem;
      color: var(--option-muted);
      line-height: 1.45;
      font-family: var(--option-body-font);
    }

    .preview-kicker {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--option-accent);
      margin-bottom: 0.65rem;
      font-weight: 700;
      font-family: var(--option-body-font);
    }

    .preview-lines {
      display: grid;
      gap: 0.4rem;
      margin-top: 0.7rem;
    }

    .preview-lines span,
    .preview-bar-group span {
      display: block;
      height: 8px;
      border-radius: 999px;
      background: var(--option-surface-alt-soft);
    }

    .preview-lines span:nth-child(2),
    .preview-bar-group span:nth-child(2) {
      width: 82%;
    }

    .preview-lines span:nth-child(3),
    .preview-bar-group span:nth-child(3) {
      width: 64%;
    }

    .preview-dashboard,
    .preview-balanced,
    .preview-editorial,
    .preview-minimal,
    .preview-expressive {
      position: relative;
    }

    .preview-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
    }

    .preview-stat {
      background: var(--option-surface-soft);
      border: 1px solid var(--option-border);
      border-radius: var(--radius-sm);
      padding: 0.8rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      backdrop-filter: blur(8px);
    }

    .preview-stat strong {
      font-size: 1.15rem;
      color: var(--option-ink);
      font-family: var(--option-heading-font);
    }

    .preview-stat span {
      font-size: 0.72rem;
      color: var(--option-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-family: var(--option-body-font);
    }

    .preview-card--wide {
      margin-bottom: 0.8rem;
    }

    .preview-bar-group {
      display: grid;
      gap: 0.45rem;
    }

    .preview-minimal {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100%;
      gap: 0.9rem;
    }

    .preview-product-topline {
      display: flex;
      gap: 0.35rem;
      align-items: center;
    }

    .preview-product-topline span {
      display: block;
      height: 7px;
      border-radius: 999px;
      background: var(--option-surface-alt-soft);
    }

    .preview-product-topline span:first-child {
      width: 68px;
      background: var(--option-accent-alt-soft);
    }

    .preview-product-topline span:nth-child(2) {
      width: 38px;
    }

    .preview-product-topline span:nth-child(3) {
      width: 24px;
    }

    .preview-product-shell {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(112px, 0.9fr);
      gap: 0.8rem;
      align-items: stretch;
    }

    .preview-product-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.45rem;
    }

    .preview-product-kicker {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--option-accent);
      font-weight: 700;
      font-family: var(--option-body-font);
    }

    .preview-product-copy h4 {
      font-family: var(--option-heading-font);
      font-size: 1.18rem;
      line-height: 1.02;
      color: var(--option-ink);
      max-width: 12ch;
    }

    .preview-product-copy p {
      font-size: 0.75rem;
      color: var(--option-muted);
      max-width: 22ch;
      font-family: var(--option-body-font);
    }

    .preview-product-actions {
      display: flex;
      gap: 0.45rem;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 0.15rem;
    }

    .preview-product-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 0.8rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--option-border);

      border-radius: var(--radius);

      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow);
