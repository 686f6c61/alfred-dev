<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selina — La Estilista</title>
  <style>
    /* =====================================================================
       Variables de tema — direccion editorial cálida, sin sesgo morado
       ===================================================================== */
    :root {
      --accent: #b85c38;
      --accent-strong: #7f3f28;
      --accent-soft: rgba(184, 92, 56, 0.14);
      --accent-hover: rgba(184, 92, 56, 0.2);
      --bg: #f4ede5;
      --bg-elevated: #fbf7f2;
      --bg-card: rgba(255, 250, 245, 0.84);
      --bg-header: rgba(251, 247, 242, 0.78);
      --text: #201714;
      --text-secondary: #5f4c42;
      --text-muted: #91796c;
      --border: rgba(118, 87, 71, 0.16);
      --border-selected: var(--accent);
      --shadow: 0 20px 50px rgba(67, 44, 31, 0.09);
      --shadow-hover: 0 28px 70px rgba(67, 44, 31, 0.16);
      --radius: 24px;
      --radius-sm: 14px;
      --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --font-sans: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --grid-line: rgba(118, 87, 71, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #dd8a60;
        --accent-strong: #f2c4aa;
        --accent-soft: rgba(221, 138, 96, 0.16);
        --accent-hover: rgba(221, 138, 96, 0.22);
        --bg: #16110f;
        --bg-elevated: #201815;
        --bg-card: rgba(35, 26, 22, 0.88);
        --bg-header: rgba(24, 18, 15, 0.82);
        --text: #f2ebe5;
        --text-secondary: #d2c1b4;
        --text-muted: #a88f81;
        --border: rgba(236, 214, 201, 0.14);
        --border-selected: var(--accent);
        --shadow: 0 18px 46px rgba(0,0,0,0.34);
        --shadow-hover: 0 28px 72px rgba(0,0,0,0.45);
        --grid-line: rgba(236, 214, 201, 0.08);
      }
    }

    /* =====================================================================
       Reset y base
       ===================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background:
        radial-gradient(circle at top left, rgba(184, 92, 56, 0.18), transparent 24rem),
        radial-gradient(circle at 85% 10%, rgba(127, 63, 40, 0.10), transparent 18rem),
        linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg) 42%, #f8f2eb 100%);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      inset: auto;
      border-radius: 999px;
      filter: blur(24px);
      opacity: 0.8;
      z-index: 0;
    }

    body::before {
      width: 18rem;
      height: 18rem;
      top: -4rem;
      right: -4rem;
      background: radial-gradient(circle, rgba(184, 92, 56, 0.18), transparent 68%);
    }

    body::after {
      width: 20rem;
      height: 20rem;
      bottom: -6rem;
      left: -6rem;
      background: radial-gradient(circle, rgba(127, 63, 40, 0.12), transparent 72%);
    }

    /* =====================================================================
       Cabecera
       ===================================================================== */
    .alfred-header {
      background: var(--bg-header);
      border: 1px solid var(--border);
      padding: 0.9rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0.9rem;
      z-index: 100;
      width: min(1240px, calc(100% - 2rem));
      margin: 0.9rem auto 0;
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .alfred-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .alfred-title {
      font-family: var(--font-display);
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--accent-strong);
    }

    .alfred-phase {
      font-size: 0.76rem;
      color: var(--text-secondary);
      padding: 0.22rem 0.72rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0.12));
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .alfred-connection {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .alfred-connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #27ae60;
      transition: background 0.3s;
    }

    /* =====================================================================
       Contenido principal
       ===================================================================== */
    .alfred-body {
      flex: 1;
      padding: 3rem 1.5rem 6rem;
      max-width: 1240px;
      margin: 0 auto;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* =====================================================================
       Barra indicadora inferior
       ===================================================================== */
    .alfred-indicator {
      background: var(--bg-header);
      border: 1px solid var(--border);
      padding: 0.75rem 1.2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-secondary);
      position: sticky;
      bottom: 1rem;
      width: min(920px, calc(100% - 2rem));
      margin: 0 auto 1rem;
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      z-index: 2;
    }

    /* =====================================================================
       Mensaje de espera
       ===================================================================== */
    .waiting-message {
      text-align: center;
      color: var(--text-secondary);
      font-size: 1.08rem;
      padding: 4.5rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,0.42), rgba(255,255,255,0.18));
      box-shadow: var(--shadow);
    }

    .style-screen-header {
      margin-bottom: 1.75rem;
      max-width: 780px;
    }

    .style-screen-header h1 {
      font-family: var(--font-display);
      font-size: clamp(2.1rem, 4vw, 3.35rem);
      line-height: 0.96;
      margin-bottom: 0.65rem;
      color: var(--text);
      letter-spacing: -0.03em;
    }

    .style-screen-kicker {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .style-screen-subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 56ch;
    }

    /* =====================================================================
       Rejilla de opciones — layout de tres columnas
       ===================================================================== */
    .style-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      .style-grid {
        grid-template-columns: 1fr;
      }
    }

    /* =====================================================================
       Opcion de estilo — columna seleccionable
       ===================================================================== */
    .style-option {
      --option-accent: var(--accent);
      --option-accent-soft: var(--accent-soft);
      --option-accent-glow: rgba(184, 92, 56, 0.24);
      --option-surface: rgba(255, 250, 245, 0.84);
      --option-surface-alt: rgba(184, 92, 56, 0.12);
      --option-ink: var(--text);
      --option-muted: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.22s, box-shadow 0.22s, transform 0.18s, background 0.22s;
      position: relative;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .style-option:hover {
      border-color: var(--option-accent);
      box-shadow: var(--shadow-hover);
      transform: translateY(-4px);
      background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0.16));
    }

    .style-option.selected {
      border-color: var(--option-accent);
      box-shadow: 0 0 0 3px var(--option-accent-soft), var(--shadow-hover);
    }

    /* =====================================================================
       Insignia de letra (A, B, C)
       ===================================================================== */
    .style-letter {
      position: absolute;
      top: 0.9rem;
      left: 0.9rem;
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--option-accent), var(--accent-strong));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.86rem;
      z-index: 2;
      box-shadow: 0 10px 24px var(--option-accent-glow);
    }

    /* =====================================================================
       Zona de previsualizacion
       ===================================================================== */
    .style-preview {
      min-height: 300px;
      padding: 1.35rem;
      background: linear-gradient(180deg, var(--option-surface), var(--option-surface-alt));
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .style-preview::after {
      content: "";
      position: absolute;
      width: 12rem;
      height: 12rem;
      right: -3rem;
      bottom: -3.5rem;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.22), transparent 72%);
      z-index: -1;
    }

    .preview-tone-note {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--option-muted);
      background: rgba(255,255,255,0.24);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 0.22rem 0.5rem;
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    /* =====================================================================
       Zona de metadatos (debajo de la previsualizacion)
       ===================================================================== */
    .style-meta {
      padding: 1.1rem 1.25rem 1.25rem;
      border-top: 1px solid var(--border);
    }

    .style-badges,
    .style-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .style-badges {
      margin-bottom: 0.75rem;
    }

    .style-links {
      margin-top: 0.75rem;
    }

    .style-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.28rem 0.55rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.16);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--option-ink);
      backdrop-filter: blur(8px);
    }

    .style-badge--soft {
      color: var(--option-muted);
      border-color: rgba(255,255,255,0.16);
    }

    .style-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.12);
      color: var(--option-ink);
      text-decoration: none;
      font-size: 0.74rem;
      font-weight: 600;
      line-height: 1;
    }

    .style-link:hover {
      border-color: var(--option-accent);
      color: var(--option-accent);
    }

    .style-name {
      font-family: var(--font-display);
      font-size: 1.28rem;
      font-weight: 700;
      line-height: 1.05;
      margin-bottom: 0.45rem;
      color: var(--option-ink);
    }

    .style-description {
      font-size: 0.87rem;
      color: var(--option-muted);
      line-height: 1.5;
      margin-bottom: 0.85rem;
    }

    /* =====================================================================
       Paleta de colores
       ===================================================================== */
    .palette {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }

    .palette-dot {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.35);
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(32, 23, 20, 0.06);
    }

    .hex {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: "SF Mono", "IBM Plex Mono", "Fira Code", monospace;
    }

    /* =====================================================================
       Etiquetas de tipografia y tono
       ===================================================================== */
    .style-typo,
    .style-tone,
    .style-sample {
      font-size: 0.79rem;
      color: var(--text-muted);
      margin-bottom: 0.32rem;
    }

    .style-typo strong,
    .style-tone strong,
    .style-sample strong {
      color: var(--option-ink);
    }

    /* =====================================================================
       Elementos mock para previsualizacion
       ===================================================================== */
    .mock-nav {
      height: 34px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.22);
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      padding: 0 0.75rem;
      gap: 0.5rem;
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
    }

    .mock-nav span {
      display: block;
      width: 32px;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.26);
    }

    .mock-hero {
      border-radius: var(--radius-sm);
      background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08));
      padding: 1.55rem 1rem;
      margin-bottom: 0.85rem;
      text-align: left;
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
    }

    .mock-hero h4 {
      font-family: var(--font-display);
      font-size: 1.18rem;
      line-height: 1.05;
      color: var(--option-ink);
      margin-bottom: 0.4rem;
      max-width: 14ch;
    }

    .mock-hero p {
      font-size: 0.76rem;
      color: var(--option-muted);
      max-width: 24ch;
    }

    .mock-button {
      display: inline-block;
      padding: 0.48rem 0.95rem;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--option-accent), var(--accent-strong));
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-align: center;
      margin-top: 0.8rem;
      box-shadow: 0 10px 20px var(--option-accent-glow);
    }

    .mock-card {
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.18);
      padding: 0.9rem;
      margin-bottom: 0.5rem;
      border: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(8px);
    }

    .mock-card h5 {
      font-size: 0.82rem;
      color: var(--option-ink);
      margin-bottom: 0.32rem;
    }

    .mock-card p {
      font-size: 0.72rem;
      color: var(--option-muted);
      line-height: 1.45;
    }

    .preview-kicker {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--option-accent);
      margin-bottom: 0.65rem;
      font-weight: 700;
    }

    .preview-lines {
      display: grid;
      gap: 0.4rem;
      margin-top: 0.7rem;
    }

    .preview-lines span,
    .preview-bar-group span {
      display: block;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
    }

    .preview-lines span:nth-child(2),
    .preview-bar-group span:nth-child(2) {
      width: 82%;
    }

    .preview-lines span:nth-child(3),
    .preview-bar-group span:nth-child(3) {
      width: 64%;
    }

    .preview-dashboard,
    .preview-balanced,
    .preview-editorial,
    .preview-minimal,
    .preview-expressive {
      position: relative;
    }

    .preview-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
    }

    .preview-stat {
      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: var(--radius-sm);
      padding: 0.8rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      backdrop-filter: blur(8px);
    }

    .preview-stat strong {
      font-size: 1.15rem;
      color: var(--option-ink);
      font-family: var(--font-display);
    }

    .preview-stat span {
      font-size: 0.72rem;
      color: var(--option-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .preview-card--wide {
      margin-bottom: 0.8rem;
    }

    .preview-bar-group {
      display: grid;
      gap: 0.45rem;
    }

    .preview-minimal {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100%;
    }

    .preview-minimal-frame {
      width: 72%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--option-ink), transparent);
      opacity: 0.35;
      margin: 1.1rem auto 1.4rem;
    }

    .preview-balance-line {
      width: 46%;
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.34);
      margin-top: 1rem;
    }

    .preview-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.28rem 0.55rem;
      border-radius: 999px;
      background: var(--option-accent-soft);
      color: var(--option-accent);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }

    .preview-stack {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 0.6rem;
      margin-top: 0.8rem;
    }

    .preview-panel {
      min-height: 64px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .preview-panel--alt {
      min-height: 88px;
      background: rgba(255,255,255,0.12);
    }

    .style-option--editorial .mock-hero h4 {
      max-width: 12ch;
      font-size: 1.32rem;
    }

    .style-option--editorial .preview-card,
    .style-option--editorial .mock-card {
      background: rgba(255,255,255,0.14);
    }

    .style-option--operational .mock-hero {
      margin-bottom: 0;
      min-height: 120px;
    }

    .style-option--operational .mock-hero h4 {
      font-size: 1.02rem;
      max-width: none;
    }

    .style-option--minimal .mock-hero {
      background: rgba(255,255,255,0.12);
      padding-top: 1.9rem;
      min-height: 170px;
    }

    .style-option--minimal .mock-hero h4 {
      max-width: 11ch;
    }

    .style-option--expressive .mock-hero {
      transform: rotate(-1.2deg);
      transform-origin: center;
    }

    .style-option--expressive .mock-button {
      transform: rotate(1.2deg);
    }

    /* =====================================================================
       Clases de compatibilidad con el patron de Superpowers
       ===================================================================== */
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 900px) {
      .options {
        grid-template-columns: 1fr;
      }
    }

    .option {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.18s;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .option:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-hover);
      transform: translateY(-4px);
    }

    .option.selected {
      border-color: var(--border-selected);
      box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-hover);
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-hover);
    }
  </style>
</head>
<body>
  <!-- Cabecera -->
  <header class="alfred-header">
    <div class="alfred-header-left">
      <span class="alfred-title">Selina — La Estilista</span>
      <span class="alfred-phase">Propuesta de estilo</span>
    </div>
    <div class="alfred-connection">
      <span id="alfred-connection-dot" class="alfred-connection-dot"></span>
      <span>Conectado</span>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="alfred-body">
    <div id="alfred-content"><!-- CONTENT --></div>
  </main>

  <!-- Barra indicadora -->
  <footer class="alfred-indicator" id="alfred-indicator">
    Haz clic en la opcion que prefieras — vuelve al terminal para continuar
  </footer>
</body>
</html>
